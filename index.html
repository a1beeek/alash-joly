function shuffle(a,seed){
  var r=a.slice(),s=seed;
  for(var i=r.length-1;i>0;i--){s=(s*9301+49297)%233280;var j=Math.floor(s/233280*(i+1));var t=r[i];r[i]=r[j];r[j]=t}

}

];
var GS={quiz:{},match:{},ord:[],tf:{},mq:0,mscore:0};

function vGame(){
  var h='<section class="sec"><h2 class="h2">Ойын: 5 тапсырма</h2><p>Әр тапсырмадан кейін негізгі нәтиже мен қорытынды шығады.</p></section>';
  // 1 quiz
  h+='<section class="card task" id="t1"><span class="tag">Тапсырма 1 · Тест</span><h3>Дұрыс жауапты таңдаңыз</h3>';
  QUIZ.forEach(function(q,i){
    h+='<div class="q"><b>'+(i+1)+'. '+q[0]+'</b><div class="opts">'+q[1].map(function(o,j){return '<button class="opt" data-quiz="'+i+':'+j+'">'+o+'</button>'}).join("")+'</div></div>';
  });
  h+='<div class="res" id="res-t1"></div></section>';
  // 2 match
  var descs=shuffle(MATCH.map(function(m){return m[1]}),7);
  h+='<section class="card task" id="t2"><span class="tag">Тапсырма 2 · Сәйкестендіру</span><h3>Тұлға мен сипаттаманы жұптаңыз</h3>';
  MATCH.forEach(function(m,i){
    h+='<div class="row"><label for="m'+i+'"><b>'+m[0]+'</b></label><select id="m'+i+'"><option value="">Таңдаңыз</option>'+descs.map(function(d){return '<option>'+d+'</option>'}).join("")+'</select></div>';
  });
  h+='<button class="btn" id="mcheck">Тексеру</button><div class="res" id="res-t2"></div></section>';
  // 3 order
  GS.ord=shuffle(ORDER,3);
  h+='<section class="card task" id="t3"><span class="tag">Тапсырма 3 · Реттеу</span><h3>Оқиғаларды ескіден жаңаға қарай орналастырыңыз</h3><ul class="ord" id="ordlist"></ul><button class="btn" id="ocheck">Тексеру</button><div class="res" id="res-t3"></div></section>';
  // 4 tf
  h+='<section class="card task" id="t4"><span class="tag">Тапсырма 4 · Дұрыс / бұрыс</span><h3>Тұжырымдар дұрыс па?</h3>';
  TRUE.forEach(function(q,i){
    h+='<div class="q"><b>'+(i+1)+'. '+q[0]+'</b><div class="opts" style="flex-direction:row"><button class="opt" style="flex:1;text-align:center" data-tf="'+i+':1">Дұрыс</button><button class="opt" style="flex:1;text-align:center" data-tf="'+i+':0">Бұрыс</button></div></div>';
  });
  h+='<div class="res" id="res-t4"></div></section>';
  // 5 map
  GS.mq=0;GS.mscore=0;
  h+='<section class="card task" id="t5"><span class="tag">Тапсырма 5 · Картадан табу</span><h3 id="mqtext"></h3>'+mapSvg({pre:"g"})+'<p class="pending" id="mqstate"></p><div class="res" id="res-t5"></div></section>';
  return h;
}
function afterGame(){
  renderOrd();
  askMap();
}
function renderOrd(){
  var u=document.getElementById("ordlist");
  if(!u)return;
  u.innerHTML=GS.ord.map(function(o,i){
    return '<li data-i="'+i+'"><span>'+o[0]+'</span><button data-up="'+i+'" aria-label="Жоғары">↑</button><button data-down="'+i+'" aria-label="Төмен">↓</button></li>';
  }).join("");
}
function askMap(){
  var t=document.getElementById("mqtext");
  if(!t)return;
  if(GS.mq>=MAPQ.length){t.textContent="Тапсырма аяқталды";document.getElementById("mqstate").textContent="";showRes("t5",GS.mscore,MAPQ.length);return}
  t.textContent=(GS.mq+1)+"/"+MAPQ.length+". "+MAPQ[GS.mq][0];
  document.getElementById("mqstate").textContent="Картадағы нүктені басыңыз.";
}

function vResult(){
  var names={t1:"Тест",t2:"Сәйкестендіру",t3:"Реттеу",t4:"Дұрыс / бұрыс",t5:"Картадан табу"};
  var S=0,T=0,done=0,rows="";
  Object.keys(names).forEach(function(k){
    var r=RESULTS[k];
    if(r){S+=r.s;T+=r.t;done++;var p=pct(r.s,r.t);
      rows+='<div class="rr"><b>'+names[k]+'</b><span>'+r.s+' / '+r.t+'</span></div><div class="bar" style="grid-column:1/-1"><i style="width:'+p+'%"></i></div>';
    }else{
      rows+='<div class="rr"><b>'+names[k]+'</b><span class="pending">орындалмаған</span></div><div class="bar" style="grid-column:1/-1"><i style="width:0%"></i></div>';
    }
  });
  var head;
  if(!done){head='<p class="pending">Әзірге тапсырма орындалмады. «Ойын» бөлімінен бастаңыз.</p>'}
  else{var P=pct(S,T);head='<div class="card"><div class="tag">Қорытынды нәтиже</div><div class="total">'+P+'%</div><p>'+S+' / '+T+' ұпай, орындалған тапсырма: '+done+' / 5.</p><p style="margin-top:6px"><b>'+tier(P)+'</b></p></div>'}
  return '<section class="sec"><h2 class="h2">Нәтиже</h2>'+head+'<div class="card" style="display:grid;gap:6px">'+rows+'</div><a class="btn alt" href="#game">Ойынға оралу</a></section>';
}

/* ---------- ROUTER ---------- */
var VIEWS={home:vHome,map:vMap,timeline:vTimeline,read:vRead,people:vPeople,video:vVideo,game:vGame,terms:vTerms,result:vResult};
function renderTabs(cur){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<a href="#'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'>'+t[1]+'</a>';
  }).join("");
  var a=document.querySelector('#tabs [aria-current="page"]');
  if(a&&a.scrollIntoView){try{a.scrollIntoView({inline:"center",block:"nearest"})}catch(e){}}
}
function route(){
  var h=location.hash.replace("#","");
  if(!VIEWS[h])h="home";
  renderTabs(h);
  $view.innerHTML=VIEWS[h]();
  if(h==="game")afterGame();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- EVENTS ---------- */
$view.addEventListener("click",function(e){
  var t=e.target;
  var chip=t.closest("[data-per]");
  if(chip){PERIOD=+chip.getAttribute("data-per");var y=window.scrollY;$view.innerHTML=vTimeline();window.scrollTo(0,y);return}
  var qz=t.closest("[data-quiz]");
  if(qz){
    var p=qz.getAttribute("data-quiz").split(":"),i=+p[0],j=+p[1];
    if(GS.quiz[i]!==undefined)return;
    GS.quiz[i]=j;
    var btns=qz.parentNode.children;
    for(var k=0;k<btns.length;k++){btns[k].disabled=true;if(k===QUIZ[i][2])btns[k].classList.add("ok")}
    if(j!==QUIZ[i][2])qz.classList.add("no");
    if(Object.keys(GS.quiz).length===QUIZ.length){
      var s=0;QUIZ.forEach(function(q,n){if(GS.quiz[n]===q[2])s++});
      showRes("t1",s,QUIZ.length);
    }
    return;
  }
  if(t.id==="mcheck"){
    var s2=0,all=true;
    MATCH.forEach(function(m,i){var v=document.getElementById("m"+i).value;if(!v)all=false;if(v===m[1])s2++});
    if(!all){var r=document.getElementById("res-t2");r.innerHTML='<div class="m">Барлық жұпты таңдаңыз.</div>';r.classList.add("show");return}
    showRes("t2",s2,MATCH.length);return;
  }
  var up=t.closest("[data-up]"),dn=t.closest("[data-down]");
  if(up||dn){
    var idx=+(up||dn).getAttribute(up?"data-up":"data-down");
    var to=up?idx-1:idx+1;
    if(to<0||to>=GS.ord.length)return;
    var tmp=GS.ord[idx];GS.ord[idx]=GS.ord[to];GS.ord[to]=tmp;
    renderOrd();return;
  }
  if(t.id==="ocheck"){
    var s3=0;
    var lis=document.querySelectorAll("#ordlist li");
    GS.ord.forEach(function(o,i){
      var ok=o[1]===ORDER[i][1];
      if(ok)s3++;
      lis[i].classList.remove("ok","no");lis[i].classList.add(ok?"ok":"no");
    });
    showRes("t3",s3,ORDER.length);return;
  }
  var tf=t.closest("[data-tf]");
  if(tf){
    var q=tf.getAttribute("data-tf").split(":"),n=+q[0],val=q[1]==="1";
    if(GS.tf[n]!==undefined)return;
    GS.tf[n]=val;
    var bs=tf.parentNode.children;
    for(var m=0;m<bs.length;m++)bs[m].disabled=true;
    tf.classList.add(val===TRUE[n][1]?"ok":"no");
    if(Object.keys(GS.tf).length===TRUE.length){
      var s4=0;TRUE.forEach(function(x,y2){if(GS.tf[y2]===x[1])s4++});
      showRes("t4",s4,TRUE.length);
    }
    return;
  }
  var g=t.closest("[data-city]");
  if(g){
    var h=location.hash.replace("#","");
    if(h==="map"){
      var c=CITIES.filter(function(x){return x.id===g.getAttribute("data-city")})[0];
      document.querySelectorAll(".pin").forEach(function(p){p.classList.remove("sel")});
      document.getElementById("m-"+c.id).classList.add("sel");
      document.getElementById("mapinfo").innerHTML="<b>"+c.n+"</b><p>"+c.i+"</p>";
    }else if(h==="game"){
      if(GS.mq>=MAPQ.length)return;
      var id=g.getAttribute("data-city"),right=MAPQ[GS.mq][1];
      var pin=document.getElementById("g-"+id);
      if(id===right){GS.mscore++;pin.classList.add("good")}else{pin.classList.add("badp");document.getElementById("g-"+right).classList.add("good")}
      GS.mq++;
      setTimeout(function(){
        document.querySelectorAll("#t5 .pin").forEach(function(p){p.classList.remove("good","badp")});
        askMap();
      },900);
    }
  }
});
$view.addEventListener("input",function(e){
  if(e.target.id==="tsearch")document.getElementById("tlist").innerHTML=termList(e.target.value);
});
route();
</script>

</body></html>
